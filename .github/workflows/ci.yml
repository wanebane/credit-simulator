name: CI/CD Pipeline - Credit Simulator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Execute Script Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for bin/credit_simulator
        run: chmod +x bin/credit_simulator

      - name: Run Unit Tests & Build Package with Maven
        run: mvn clean package

      - name: Test CLI Execution (With Sample File Input)
        run: |
          echo -e "Mobil\nBekas\n2022\n100000000\n3\n25000000" > test_input.txt
          ./bin/credit_simulator test_input.txt

  docker-build-push:
    name: Build & Push Docker Image to Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:latest
            ${{ secrets.DOCKERHUB_SHA }}